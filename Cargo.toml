[package]
name = "playout-transcode"
version = "1.0.0"
edition = "2021"
authors = ["Alex Fountas (Soranokuni) <fountasalexandros@gmail.com>"]
repository = "https://github.com/Soranokuni/PlayoutTranscode"
license = "MIT"
description = "PlayoutTranscode - Automated broadcast media ingest, analysis, and mezzanine transcoding engine"

[lib]
name = "playout_transcode"
path = "src/lib.rs"

[[bin]]
name = "PlayoutTranscode"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
notify = { version = "8", features = ["macos_kqueue"] }
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "timeout", "limit", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "blocking"] }
zip = "2"
sha2 = "0.10"
anyhow = "1"
parking_lot = "0.12"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "derive"] }
fnv = "1.0"
tracing-appender = "0.2"

[dev-dependencies]
# Async client for the integration harness in tests/common. The main crate only
# uses reqwest's blocking client (bootstrap's FFmpeg download).
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Console",
] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
# Symbols are kept (T3-6). `strip = true` produced a binary whose panic
# backtraces were a list of hex addresses, which on a broadcast host that has
# crashed once in three months is the difference between a diagnosis and a
# shrug. `build-installer.ps1` copies the .pdb into a `symbols/` artifact beside
# the installer rather than into it, so the shipped payload is unchanged.
strip = false
debug = 1

# The profile optimises for size, which suits a daemon whose hot path is inside
# FFmpeg. Two packages are exceptions, both measured on this machine against an
# all-"s" build (170 MB SHA-256; serialising a 5 000-asset listing):
#
#   all "s"                        163 MB/s   3.53 ms   7.49 MB exe
#   + sha2, serde_json at 3        317 MB/s   3.52 ms   7.51 MB exe
#   everything at 3                298 MB/s   1.72 ms  10.23 MB exe
#   + sha2, this crate at 3        332 MB/s   1.65 ms   9.22 MB exe  <- this
#
# sha2 is the toolchain hash and the duplicate-confirmation hash: 2.0x.
#
# Overriding `serde_json` did nothing, which is the interesting part -- the work
# of serialising an AssetResponse is in the *derive-generated* Serialize impl,
# and that lives in this crate, not in serde_json. Building this crate at 3 is
# what buys the 2.1x, and it costs 1 MB less than raising the whole graph.
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.playout-transcode]
opt-level = 3
