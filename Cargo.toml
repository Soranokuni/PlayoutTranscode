[package]
name = "playout-transcode"
version = "1.0.0"
edition = "2021"
authors = ["Soranokuni <shadowsora13@hotmail.gr>"]
repository = "https://github.com/Soranokuni/PlayoutTranscode"
license = "MIT"
description = "PlayoutTranscode - Automated broadcast media ingest, analysis, and mezzanine transcoding engine"

[lib]
name = "playout_transcode"
path = "src/lib.rs"

[[bin]]
name = "PlayoutTranscode"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
notify = { version = "7", features = ["macos_kqueue"] }
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "timeout", "limit", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "blocking"] }
zip = "2"
sha2 = "0.10"
regex = "1"
anyhow = "1"
parking_lot = "0.12"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "derive"] }
fnv = "1.0"
tracing-appender = "0.2"

[dev-dependencies]
# Async client for the integration harness in tests/common. The main crate only
# uses reqwest's blocking client (bootstrap's FFmpeg download).
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Console",
] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
